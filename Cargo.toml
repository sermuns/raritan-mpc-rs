[workspace]
resolver = "3"
members = ["raritan-cli", "raritan-mpc", "raritan-rdm", "raritan-rfb", "raritan-common", "raritan-session"]
default-members = ["raritan-mpc"]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "WTFPL"
publish = false

[workspace.dependencies]
eyre = "0.6"
openssl = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.23"
flate2 = "1"
rc4 = "0.2"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
raritan-common = { path = "raritan-common" }
raritan-rdm = { path = "raritan-rdm" }
raritan-rfb = { path = "raritan-rfb" }
raritan-session = { path = "raritan-session" }
