[workspace]
resolver = "3"
members = ["raritan-cli", "raritan-mpc", "raritan-rdm", "raritan-rfb", "raritan-common", "raritan-session", "raritan-web"]
default-members = ["raritan-mpc"]

[workspace.package]
version = "1.5.0"
edition = "2024"
license = "WTFPL"
publish = false

[workspace.dependencies]
eyre = "0.6"
openssl = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.23"
flate2 = "1"
rc4 = "0.2"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
png = "0.18"
percent-encoding = "2"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
nucleo = "0.5"
raritan-common = { path = "raritan-common" }
raritan-rdm = { path = "raritan-rdm" }
raritan-rfb = { path = "raritan-rfb" }
raritan-session = { path = "raritan-session" }
raritan-web = { path = "raritan-web" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Boilerplate for eyre-style error handling: every fallible helper returns
# `eyre::Result`, so per-function `# Errors` sections would add no information.
missing_errors_doc = "allow"
# Trivial getters/converters in workspace-internal crates.
must_use_candidate = "allow"
# Wire parsing with explicit length/range checks; `try_into` everywhere would
# drown the protocol logic for no added safety.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
uninlined_format_args = "allow"
