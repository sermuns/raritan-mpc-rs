[project]
site_url = "https://example.com/raritan-mpc-rs/"
site_name = "Raritan MPC (Rust)"
site_description = "Rust rewrite of the Raritan MPC KVM client: protocol notes and dev docs."
site_author = [
  "gpt-5.6-luna",
  "Muse Spark 1.3 Free",
  "sermuns",  # barely..
]

nav = [
  { "Overview" = "index.md" },
  { "Flows" = "flows.md" },
  { "RFB protocol" = "rfb.md" },
  { "RDM protocol" = "rdm.md" },
  { "Verification" = "verification.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
favicon = "assets/images/favicon.png"
logo = "assets/logo.png"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]
