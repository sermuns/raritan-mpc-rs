name: Release
on:
  push:
    tags:
      - "v*"

env:
  GUI_NAME: raritan-mpc

jobs:
  publish-github:
    name: Publish for ${{ matrix.build.OS }} (${{ matrix.build.TARGET }})
    runs-on: ${{ matrix.build.OS }}
    permissions:
      contents: write # for publishing release
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              OS: ubuntu-latest,
              TOOLCHAIN: stable,
              TARGET: x86_64-unknown-linux-gnu,
            }
          - {
              OS: windows-latest,
              TOOLCHAIN: stable,
              TARGET: x86_64-pc-windows-msvc,
            }
    steps:
      - uses: actions/checkout@v7

      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.build.TOOLCHAIN }}
          targets: ${{ matrix.build.TARGET }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.build.TARGET }}

      - name: Build raritan-mpc
        run: cargo build --release --locked -p raritan-mpc --target ${{ matrix.build.TARGET }} --features vendored-openssl

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p ${{ env.GUI_NAME }}-${{ env.RELEASE_VERSION }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.build.TARGET }}/release/${{ env.GUI_NAME }}.exe ${{ env.GUI_NAME }}-${{ env.RELEASE_VERSION }}/
          else
            cp target/${{ matrix.build.TARGET }}/release/${{ env.GUI_NAME }} ${{ env.GUI_NAME }}-${{ env.RELEASE_VERSION }}/
            cp raritan-mpc.desktop ${{ env.GUI_NAME }}-${{ env.RELEASE_VERSION }}/
          fi
          cp COPYING NOTICE ${{ env.GUI_NAME }}-${{ env.RELEASE_VERSION }}/
          cp -r LICENSES ${{ env.GUI_NAME }}-${{ env.RELEASE_VERSION }}/

      - name: Create release artifacts
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${{ env.GUI_NAME }}-${{ matrix.build.TARGET }}.zip" ${{ env.GUI_NAME }}-${{ env.RELEASE_VERSION }}/
          else
            tar -czvf ${{ env.GUI_NAME }}-${{ matrix.build.TARGET }}.tar.gz ${{ env.GUI_NAME }}-${{ env.RELEASE_VERSION }}/
            shasum -a 512 ${{ env.GUI_NAME }}-${{ matrix.build.TARGET }}.tar.gz > ${{ env.GUI_NAME }}-${{ matrix.build.TARGET }}.tar.gz.sha512
          fi

      - name: Upload the binary releases
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.GUI_NAME }}-${{ matrix.build.TARGET }}.tar.gz
            ${{ env.GUI_NAME }}-${{ matrix.build.TARGET }}.tar.gz.sha512
            ${{ env.GUI_NAME }}-${{ matrix.build.TARGET }}.zip
          fail_on_unmatched_files: false
